                required:
                - error
                - message
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error code or type
                  message:
                    type: string
                    description: Human-readable error message
                required:
                - error
                - message
        '504':
          description: Gateway Timeout - Test execution exceeded time limit
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error code or type
                  message:
                    type: string
                    description: Human-readable error message
                required:
                - error
                - message
components:
  schemas:
    TestDetail:
      allOf:
      - $ref: '#/components/schemas/TestDefinition'
      - type: object
        properties:
          groups:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                isDefault:
                  type: boolean
              required:
              - id
              - name
              - isDefault
    TestStep:
      oneOf:
      - type: object
        properties:
          title:
            type: string
          type:
            type: string
            enum:
            - act
        required:
        - title
        - type
      - type: object
        properties:
          title:
            type: string
          type:
            type: string
            enum:
            - assert
        required:
        - title
        - type
      - type: object
        properties:
          title:
            type: string
          type:
            type: string
            enum:
            - login
          credentialId:
            type: string
            format: uuid
          temporaryEmail:
            type: boolean
        required:
        - title
        - type
      - type: object
        properties:
          title:
            type: string
          type:
            type: string
            enum:
            - files
          fileIds:
            type: array
            items:
              type: string
              format: uuid
        required:
        - title
        - type
        - fileIds
      - type: object
        properties:
          title:
            type: string
          type:
            type: string
            enum:
            - screenshot
        required:
        - type
      - type: object
        properties:
          title:
            type: string
          type:
            type: string
            enum:
            - javascript
          code:
            type: string
            description: 'JavaScript run in the browser page. Runs as an awaited function body; passes if it completes without throwing (returns nothing or { success: true }) and fails if it returns { success: false, reason } or throws. Web tests only.'
        required:
        - type
        - code
    TestDefinition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
        platform:
          type: string
          enum:
          - web
          - mobile
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TestStep'
        projectId:
          type: string
          format: uuid
        projectUrl:
          type: string
          nullable: true
          format: uri
        projectName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - title
      - steps
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: API key authentication using Bearer token format
