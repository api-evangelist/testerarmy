components:
  schemas:
    ProjectDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        shortId:
          type: string
          nullable: true
        name:
          type: string
        url:
          type: string
          nullable: true
        projectType:
          type: string
          enum:
          - web
          - mobile
        description:
          type: string
          nullable: true
        environments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              slug:
                type: string
              kind:
                type: string
                enum:
                - production
                - pr_preview
                - static
              url:
                type: string
                nullable: true
            required:
            - id
            - name
            - slug
            - kind
            - url
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - shortId
      - name
      - url
      - projectType
      - description
      - environments
    ProjectFileSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          nullable: true
          format: uuid
        filename:
          type: string
        mediaType:
          type: string
        fileSize:
          type: integer
        description:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        createdAt:
          type: string
          nullable: true
          format: date-time
      required:
      - id
      - projectId
      - filename
      - mediaType
      - fileSize
      - description
      - summary
      - createdAt
    CredentialSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - login
          - inbox
        authMethod:
          type: string
          enum:
          - password
          - google
          - github
          - custom
        label:
          type: string
        username:
          type: string
        hasAuthInstructions:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - kind
      - authMethod
      - label
      - username
      - hasAuthInstructions
      - createdAt
    ProjectEnvironment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        kind:
          type: string
          enum:
          - production
          - pr_preview
          - static
        url:
          type: string
          nullable: true
      required:
      - id
      - name
      - slug
      - kind
      - url
    ProjectMemory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
          enum:
          - site_structure
          - test_insights
          - user_preferences
        title:
          type: string
        content:
          type: string
        importance:
          type: string
          enum:
          - high
          - medium
          - low
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - category
      - title
      - content
      - importance
      - createdAt
      - updatedAt
    DynamicPrRunRequest:
      anyOf:
      - type: object
        properties:
          targetUrl:
            type: string
            format: uri
          platform:
            type: string
            enum:
            - web
          pullRequest:
            type: object
            properties:
              provider:
                type: string
                enum:
                - github
                default: github
              number:
                type: integer
                minimum: 0
                exclusiveMinimum: true
              title:
                type: string
                minLength: 1
                maxLength: 500
              description:
                type: string
                maxLength: 5000
              baseBranch:
                type: string
                minLength: 1
                maxLength: 255
              headBranch:
                type: string
                minLength: 1
                maxLength: 255
              commitSha:
                type: string
                minLength: 1
                maxLength: 100
            required:
            - number
            - title
            - commitSha
            additionalProperties: false
        required:
        - targetUrl
        - pullRequest
        additionalProperties: false
      - type: object
        properties:
          platform:
            type: string
            enum:
            - ios
            - android
          pullRequest:
            type: object
            properties:
              provider:
                type: string
                enum:
                - github
                default: github
              number:
                type: integer
                minimum: 0
                exclusiveMinimum: true
              title:
                type: string
                minLength: 1
                maxLength: 500
              description:
                type: string
                maxLength: 5000
              baseBranch:
                type: string
                minLength: 1
                maxLength: 255
              headBranch:
                type: string
                minLength: 1
                maxLength: 255
              commitSha:
                type: string
                minLength: 1
                maxLength: 100
            required:
            - number
            - title
            - commitSha
            additionalProperties: false
          mobile:
            type: object
            properties:
              appId:
                type: string
                format: uuid
              bundleId:
                type: string
                minLength: 1
              artifactUrl:
                type: string
                format: uri
              artifactFilename:
                type: string
                minLength: 1
              buildId:
                type: string
                minLength: 1
            additionalProperties: false
          simulatorRegion:
            type: string
            enum:
            - eu-north1
            - us-west1
        required:
        - platform
        - pullRequest
        additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: API key authentication using Bearer token format
