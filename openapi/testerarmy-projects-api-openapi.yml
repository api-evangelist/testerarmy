  /v1/projects/{projectId}/pull-request-runs:
    post:
      summary: Trigger a dynamic pull request run
      description: Trigger the dynamic PR agent from CI using PR metadata. Callers do not send changed files; TesterArmy enriches with changed files and GitHub reporting only when the project has a supported GitHub connection.
      tags:
      - Projects
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
          description: Project ID or shortId
        required: true
        description: Project ID or shortId
        name: projectId
        in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicPrRunRequest'
      responses:
        '202':
          description: Dynamic PR run queued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - queued
                  runId:
                    type: string
                    format: uuid
                  projectId:
                    type: string
                    format: uuid
                  platform:
                    type: string
                    enum:
                    - web
                    - ios
                    - android
                  metadata:
                    type: object
                    properties:
                      github:
                        type: object
                        properties:
                          configured:
                            type: boolean
                          checkRunCreated:
                            type: boolean
                          commentTargetResolved:
                            type: boolean
                          status:
                            type: string
                            enum:
                            - not_configured
                            - check_create_failed
                            - pr_not_found
                        required:
                        - configured
                        - checkRunCreated
                        - commentTargetResolved
                      mobile:
                        type: object
                        properties:
                          source:
                            type: string
                          buildId:
                            type: string
                        required:
                        - source
                required:
                - status
                - runId
                - projectId
                - platform
        '400':
          description: Bad Request - Invalid input parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error code or type
                  message:
                    type: string
                    description: Human-readable error message
                required:
                - error
                - message
        '401':
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                type: object
