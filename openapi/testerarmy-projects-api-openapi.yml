openapi: 3.0.0
info:
  title: TestArmy Groups Projects API
  version: 1.0.0
  description: AI-powered browser automation API for QA testing. Automate web testing workflows using natural language prompts.
servers:
- url: https://tester.army/api
  description: Production API server
tags:
- name: Projects
paths:
  /v1/projects:
    get:
      summary: List projects
      description: List projects available to the authenticated API key's team.
      tags:
      - Projects
      security:
      - bearerAuth: []
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        shortId:
                          type: string
                        name:
                          type: string
                        url:
                          type: string
                          nullable: true
                          format: uri
                        projectType:
                          type: string
                          enum:
                          - web
                          - mobile
                        environments:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              name:
                                type: string
                              slug:
                                type: string
                              kind:
                                type: string
                                enum:
                                - production
                                - pr_preview
                                - static
                              url:
                                type: string
                                nullable: true
                            required:
                            - id
                            - name
                            - slug
                            - kind
                            - url
                      required:
                      - id
                      - shortId
                      - name
                      - url
                      - projectType
                required:
                - projects
        '400':
          description: Bad Request - Invalid input parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error code or type
                  message:
                    type: string
                    description: Human-readable error message
                required:
                - error
                - message
        '401':
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error code or type
                  message:
                    type: string
                    description: Human-readable error message
                required:
                - error
                - message
        '429':
          description: Too Many Requests - Usage limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error code or type
                  message:
                    type: string
                    description: Human-readable error message
                required:
                - error
                - message
        '500':
          description: Internal Server Error
