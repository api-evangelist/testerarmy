                    type: string
                    description: Human-readable error message
                required:
                - error
                - message
        '401':
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error code or type
                  message:
                    type: string
                    description: Human-readable error message
                required:
                - error
                - message
        '403':
          description: Project limit exceeded for the current plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error code or type
                  message:
                    type: string
                    description: Human-readable error message
                  currentCount:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                    minimum: 0
                required:
                - error
                - message
                - currentCount
                - limit
        '429':
          description: Too Many Requests - Usage limit exceeded
          content:
            application/json:
