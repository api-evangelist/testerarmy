  /v1/groups/{groupId}/tests/{testId}:
    delete:
      summary: Remove a test from a group
      description: Remove a test from a test group. Clears the group's prepTestId if it pointed at the removed test. `removed` is `true` when a membership row was deleted, `false` when the test was not a member (idempotent).
      tags:
      - Groups
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
          format: uuid
          description: Test group ID
        required: true
        description: Test group ID
        name: groupId
        in: path
      - schema:
          type: string
          format: uuid
          description: Test ID
        required: true
        description: Test ID
        name: testId
        in: path
      responses:
        '200':
          description: Idempotent removal result
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupId:
                    type: string
                    format: uuid
                  testId:
                    type: string
                    format: uuid
                  removed:
                    type: boolean
                required:
                - groupId
                - testId
                - removed
        '400':
          description: Bad Request - Invalid input parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error code or type
                  message:
