  /v1/groups/{groupId}/tests:
    post:
      summary: Add a test to a group
      description: 'Add an existing test to a test group. Returns 201 when a new membership row was created, or 200 with `added: false` when the test was already a member (idempotent).'
      tags:
      - Groups
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
          format: uuid
          description: Test group ID
        required: true
        description: Test group ID
        name: groupId
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                testId:
                  type: string
                  format: uuid
              required:
              - testId
      responses:
        '200':
          description: Test was already a member; no change
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupId:
                    type: string
                    format: uuid
                  testId:
                    type: string
                    format: uuid
                  added:
                    type: boolean
                    enum:
                    - false
                required:
                - groupId
                - testId
                - added
        '201':
          description: Test added to group
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupId:
                    type: string
                    format: uuid
                  testId:
                    type: string
                    format: uuid
                  added:
                    type: boolean
                    enum:
                    - true
                required:
