                properties:
                  error:
                    type: string
                    description: Error code or type
                  message:
                    type: string
                    description: Human-readable error message
                required:
                - error
                - message
        '504':
          description: Gateway Timeout - Test execution exceeded time limit
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error code or type
                  message:
                    type: string
                    description: Human-readable error message
                required:
                - error
                - message
    post:
      summary: Create a test group
      description: Create a test group in a project. Capped at 20 groups per project.
      tags:
      - Groups
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  description: Project ID
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                runMode:
                  type: string
                  enum:
                  - concurrent
                  - sequential
                prepTestId:
                  type: string
                  nullable: true
                  format: uuid
              required:
              - projectId
              - name
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                type: object
                properties:
                  group:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      isDefault:
                        type: boolean
                      runMode:
                        type: string
                        enum:
                        - concurrent
                        - sequential
                      prepTestId:
                        type: string
                        nullable: true
                        format: uuid
                      projectId:
                        type: string
                        format: uuid
                    required:
                    - id
                    - name
                    - isDefault
                    - runMode
                    - prepTestId
                    - projectId
