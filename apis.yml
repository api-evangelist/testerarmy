aid: testerarmy
name: Testerarmy
description: >-
  TesterArmy is an AI-powered QA testing platform (Y Combinator, batch P26) whose
  browser and mobile agents test web and mobile apps like a real user - navigating
  pages, filling forms, handling login, OAuth and OTP flows, and catching broken
  flows, rendering bugs and confusing UX. You describe tests in plain English and
  the agent runs them in the TesterArmy cloud (or locally), on every GitHub pull
  request or on a schedule, returning screenshots, recordings and actionable bug
  reports. It exposes a public REST API (bearer API-key auth), a first-party CLI
  (testerarmy / ta), inbound trigger webhooks, and mobile app upload and testing.
